name: Build & Publish z3rno-postgres image

on:
  push:
    branches: [main]
    paths:
      - 'docker/postgres/**'
      - '.github/workflows/postgres-image.yml'
  pull_request:
    paths:
      - 'docker/postgres/**'
      - '.github/workflows/postgres-image.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: the-ai-project-co/z3rno-postgres

jobs:
  lint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/postgres/Dockerfile
          failure-threshold: warning
          ignore: DL3008,DL3018  # Pinning apt versions would be too brittle for a weekly-updated image

  build:
    name: Build & push
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=17
            type=raw,value=17-{{date 'YYYYMMDD'}}
            type=sha,prefix=17-,format=short
          labels: |
            org.opencontainers.image.title=z3rno-postgres
            org.opencontainers.image.description=PostgreSQL 17 with pgvector + pgvectorscale + Apache AGE + pg_cron + pgaudit, pre-configured for Z3rno
            org.opencontainers.image.source=https://github.com/the-ai-project-co/z3rno-core
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/postgres
          file: docker/postgres/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64  # arm64 can be added once pgvectorscale publishes arm64 binaries

  smoke-test:
    name: Smoke test (extensions load)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Pull the just-pushed image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:17

      - name: Start container
        run: |
          docker run -d --name z3rno-pg-smoke \
            -e POSTGRES_DB=z3rno \
            -e POSTGRES_USER=z3rno \
            -e POSTGRES_PASSWORD=z3rno \
            -p 5432:5432 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:17
          # Wait for readiness
          for i in $(seq 1 30); do
            if docker exec z3rno-pg-smoke pg_isready -U z3rno -d z3rno; then
              break
            fi
            sleep 2
          done

      - name: Verify every extension loaded
        run: |
          set -e
          docker exec z3rno-pg-smoke psql -U z3rno -d z3rno -c "\dx" | tee /tmp/extensions.txt
          for ext in vector vectorscale age pg_cron pgaudit pgcrypto; do
            if grep -q "^ $ext " /tmp/extensions.txt; then
              echo "OK: $ext is installed"
            else
              echo "FAIL: $ext is missing!"
              docker logs z3rno-pg-smoke
              exit 1
            fi
          done

      - name: Verify AGE memory_graph exists
        run: |
          docker exec z3rno-pg-smoke psql -U z3rno -d z3rno -c "
            LOAD 'age';
            SET search_path = ag_catalog, \"\$user\", public;
            SELECT * FROM cypher('memory_graph', \$cypher\$ MATCH (n) RETURN count(n) \$cypher\$) AS (count agtype);
          "

      - name: Cleanup
        if: always()
        run: docker rm -f z3rno-pg-smoke || true
