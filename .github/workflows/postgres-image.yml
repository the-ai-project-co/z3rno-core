name: Build & Publish z3rno-postgres image

on:
  push:
    branches: [main]
    paths:
      - 'docker/postgres/**'
      - '.github/workflows/postgres-image.yml'
  pull_request:
    paths:
      - 'docker/postgres/**'
      - '.github/workflows/postgres-image.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: the-ai-project-co/z3rno-postgres

jobs:
  lint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/postgres/Dockerfile
          failure-threshold: warning
          ignore: DL3008,DL3018,DL3003  # Unpinned apt versions (brittle to pin) + cd inside RUN (idiomatic for single-shot build steps)

  build:
    name: Build & push
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=17
            type=raw,value=17-{{date 'YYYYMMDD'}}
            type=sha,prefix=17-,format=short
          labels: |
            org.opencontainers.image.title=z3rno-postgres
            org.opencontainers.image.description=PostgreSQL 17 with pgvector + pgvectorscale + Apache AGE + pg_cron + pgaudit, pre-configured for Z3rno
            org.opencontainers.image.source=https://github.com/the-ai-project-co/z3rno-core
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/postgres
          file: docker/postgres/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64  # arm64 can be added once pgvectorscale publishes arm64 binaries

  smoke-test:
    name: Smoke test (extensions load)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR (needed even for pulling our own private package on first push)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the just-pushed image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:17

      - name: Start container
        run: |
          docker run -d --name z3rno-pg-smoke \
            -e POSTGRES_DB=z3rno \
            -e POSTGRES_USER=z3rno \
            -e POSTGRES_PASSWORD=z3rno \
            -p 5432:5432 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:17
          # Wait for readiness
          for i in $(seq 1 30); do
            if docker exec z3rno-pg-smoke pg_isready -U z3rno -d z3rno; then
              break
            fi
            sleep 2
          done

      - name: Verify every extension is available for CREATE EXTENSION
        run: |
          set -e
          echo "=== pg_available_extensions ==="
          docker exec z3rno-pg-smoke psql -U z3rno -d z3rno -c "
            SELECT name, default_version, installed_version, comment
            FROM pg_available_extensions
            WHERE name IN ('vector', 'vectorscale', 'age', 'pg_cron', 'pgaudit', 'pgcrypto')
            ORDER BY name;
          " | tee /tmp/available.txt
          for ext in vector vectorscale age pg_cron pgaudit pgcrypto; do
            if grep -q "^ $ext " /tmp/available.txt; then
              echo "OK: $ext is available"
            else
              echo "FAIL: $ext is NOT available (files missing from image)"
              echo "--- container logs ---"
              docker logs z3rno-pg-smoke
              exit 1
            fi
          done

      - name: Create each extension in the public schema
        run: |
          set -e
          docker exec -i z3rno-pg-smoke psql -U z3rno -d z3rno -v ON_ERROR_STOP=1 -a <<'SQL'
            SET search_path = public;
            CREATE EXTENSION IF NOT EXISTS pgcrypto    WITH SCHEMA public;
            CREATE EXTENSION IF NOT EXISTS vector      WITH SCHEMA public;
            CREATE EXTENSION IF NOT EXISTS vectorscale CASCADE;
            CREATE EXTENSION IF NOT EXISTS pg_cron;
            CREATE EXTENSION IF NOT EXISTS pgaudit;
          SQL
          # AGE must be CREATE'd without WITH SCHEMA (it creates its own ag_catalog)
          docker exec z3rno-pg-smoke psql -U z3rno -d z3rno -v ON_ERROR_STOP=1 -a -c "
            CREATE EXTENSION IF NOT EXISTS age;
          "
          echo "--- \\dx (all extensions and their schemas) ---"
          docker exec z3rno-pg-smoke psql -U z3rno -d z3rno -c "
            SELECT e.extname, e.extversion, n.nspname AS schema
            FROM pg_extension e
            JOIN pg_namespace n ON e.extnamespace = n.oid
            ORDER BY e.extname;
          "

      - name: Exercise pgvector (round-trip a vector)
        run: |
          docker exec z3rno-pg-smoke psql -U z3rno -d z3rno -v ON_ERROR_STOP=1 -c "
            SET search_path = public;
            SELECT '[1,2,3]'::public.vector <=> '[1,2,4]'::public.vector AS cosine_distance;
          "

      - name: Exercise Apache AGE (create graph, add node via Cypher, drop)
        run: |
          docker exec -i z3rno-pg-smoke psql -U z3rno -d z3rno -v ON_ERROR_STOP=1 <<'SQL'
            LOAD 'age';
            SET search_path = ag_catalog, public;
            SELECT create_graph('smoke_test_graph');
            SELECT * FROM cypher('smoke_test_graph', $$
              CREATE (n:Person {name: 'smoke'})
              RETURN n
            $$) AS (n agtype);
            SELECT drop_graph('smoke_test_graph', true);
          SQL

      - name: Exercise pg_cron (schedule + unschedule a job)
        run: |
          docker exec z3rno-pg-smoke psql -U z3rno -d z3rno -v ON_ERROR_STOP=1 -c "
            SELECT cron.schedule('smoke_test_job', '* * * * *', 'SELECT 1');
            SELECT cron.unschedule('smoke_test_job');
          "

      - name: All extensions verified
        run: |
          echo ""
          echo "=========================================="
          echo "  All extensions verified end-to-end ✓"
          echo "=========================================="

      - name: Cleanup
        if: always()
        run: docker rm -f z3rno-pg-smoke || true
