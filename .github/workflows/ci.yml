name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Migrations — schema qualification check
        # See scripts/check_migration_schema_qualification.py.
        # Apache AGE puts ag_catalog first on search_path; unqualified
        # DDL lands there. This caught the v0.7.0 incident.
        run: uv run python scripts/check_migration_schema_qualification.py

      - name: Ruff — lint
        run: uv run ruff check src/ tests/

      - name: Ruff — format check
        run: uv run ruff format --check src/ tests/

      - name: mypy — type check
        run: uv run mypy src/ tests/

      - name: pytest — unit + integration tests
        run: uv run pytest -v --cov --cov-report=term-missing
