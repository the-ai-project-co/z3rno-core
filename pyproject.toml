[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# =============================================================================
# Project metadata (PEP 621)
# =============================================================================
[project]
name = "z3rno-core"
version = "0.1.1"
description = "Core memory engine for Z3rno: PostgreSQL schema, SQLAlchemy models, Alembic migrations, and the store/recall/forget/audit library functions."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "The AI Project Co.", email = "engineering@z3rno.dev" },
]
keywords = [
  "ai-agents",
  "memory",
  "vector-database",
  "pgvector",
  "apache-age",
  "postgresql",
  "rag",
  "agent-memory",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# =============================================================================
# Runtime dependencies — what z3rno-server needs at import time
# =============================================================================
dependencies = [
  # Database
  "asyncpg>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14.0",
  "pgvector>=0.3.6",
  "psycopg[binary]>=3.2.0",  # used only by Alembic for sync migrations
  # Validation / models
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  # LLM / embedding proxy (deferred to z3rno-server but the engine
  # has a thin abstraction over the LiteLLM client interface)
  "litellm>=1.55.0",
  # Resilience
  "tenacity>=9.0.0",
  # Logging
  "structlog>=24.4.0",
  # Hash chain for audit log
  "cryptography>=43.0.0",
]

[project.optional-dependencies]
# Worker-only dependencies for Celery tasks (decay, summarisation,
# entity extraction). Imported only when running as a Celery worker.
worker = [
  "celery[redis]>=5.4.0",
]

# Observability — optional because it adds 30+ MB of OTel deps that
# only the production cloud needs
observability = [
  "opentelemetry-api>=1.29.0",
  "opentelemetry-sdk>=1.29.0",
  "opentelemetry-instrumentation-asyncpg>=0.50b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
  "prometheus-client>=0.21.0",
]

[dependency-groups]
# Dev dependencies (PEP 735) — installed by `uv sync --all-extras --dev`
dev = [
  # Test runner
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "hypothesis>=6.115.0",
  # Test infra
  "testcontainers[postgres]>=4.9.0",
  "factory-boy>=3.3.0",
  "polyfactory>=2.18.0",
  # Lint + format + type
  "ruff>=0.8.6",
  "mypy>=1.13.0",
  # Type stubs
  "types-redis>=4.6.0",
  # Seed data
  "numpy>=2.0.0",
  # Pre-commit (optional)
  "pre-commit>=4.0.0",
  # API reference docs
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.27.0",
]

[project.scripts]
schema = "scripts.generate_schema:main"

[project.urls]
Homepage = "https://z3rno.dev"
Documentation = "https://github.com/the-ai-project-co/z3rno-docs"
Repository = "https://github.com/the-ai-project-co/z3rno-core"
Issues = "https://github.com/the-ai-project-co/z3rno-core/issues"

# =============================================================================
# Hatchling build config — src/ layout
# =============================================================================
[tool.hatch.build.targets.wheel]
packages = ["src/z3rno_core"]

[tool.hatch.build.targets.sdist]
include = [
  "src/z3rno_core",
  "tests",
  "docs",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

# =============================================================================
# Ruff — linter + formatter (replaces black, isort, flake8, pyupgrade)
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docker", "docs"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
  "N",      # pep8-naming
  "S",      # bandit (security)
  "A",      # flake8-builtins
  "T20",    # flake8-print
  "SIM",    # flake8-simplify
  "RUF",    # ruff-specific
  "PT",     # flake8-pytest-style
  "PL",     # pylint
  "TRY",    # tryceratops
  "PERF",   # perflint
]
ignore = [
  "E501",     # line too long (handled by formatter)
  "S101",     # use of `assert` (fine in tests)
  "PLR0913",  # too many arguments (we have wide function signatures by design)
  "TRY003",   # avoid long messages outside exception class (we want clear errors)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",     # asserts are fine in tests
  "S110",     # try-except-pass is fine in tests (intentional error tolerance)
  "S608",     # SQL injection warnings are fine in tests (trusted UUIDs)
  "PLR2004",  # magic numbers are fine in tests
  "S105",     # hardcoded passwords are fine in tests
  "S106",     # hardcoded passwords for kwargs are fine in tests
  "PLC0415",  # imports inside functions are fine in tests (we test import side-effects)
]
"seeds/**/*.py" = [
  "T201",     # print is fine in seed scripts (CLI output)
  "PLR2004",  # magic numbers are fine in seed data
  "PLR0915",  # many statements are fine in seed scripts
  "S311",     # pseudo-random is fine for seed data
]
"src/z3rno_core/engine/**/*.py" = [
  "S608",     # Dynamic SQL construction is inherent to the query builder
  "S110",     # try-except-pass for AGE extension not loaded (forget.py)
  "B023",     # Lambda loop variable binding in run_sync is intentional
  "PLC0415",  # Lazy imports to avoid circular dependencies
  "PLR0912",  # recall() has many branches by design (filter combinations)
  "PLR0915",  # recall() has many statements by design (multi-step pipeline)
  "PLR2004",  # Magic values are row indices from SQL result tuples
  "SIM105",   # contextlib.suppress not ideal for async conn.run_sync pattern
]
"src/z3rno_core/graph/**/*.py" = [
  "S608",     # AGE Cypher queries require string interpolation (no parameterized Cypher)
]
"scripts/**/*.py" = [
  "T201",     # print is fine in scripts (CLI output)
  "INP001",   # scripts dir is not a package
  "PLR0915",  # Many statements fine in scripts
  "PERF401",  # List append in loop is clearer than extend for schema gen
  "PLR2004",  # magic numbers are fine in seed data
]
"src/z3rno_core/_version.py" = ["UP"]

[tool.ruff.lint.isort]
known-first-party = ["z3rno_core"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# =============================================================================
# mypy — strict static type checking
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
files = ["src/z3rno_core", "tests"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["testcontainers", "testcontainers.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# =============================================================================
# pytest
# =============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--showlocals",
]
markers = [
  "integration: tests that need a real PostgreSQL container (slow)",
  "slow: tests that take >1 second",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pydantic.*",
  "ignore::pytest.PytestUnraisableExceptionWarning",
]

# =============================================================================
# coverage
# =============================================================================
[tool.coverage.run]
source = ["src/z3rno_core"]
branch = true
parallel = true
omit = [
  "*/_version.py",
  "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "\\.\\.\\.",
]
show_missing = true
skip_covered = false
fail_under = 95  # raised from 55; engine functions now have thorough unit tests with mocked DB
